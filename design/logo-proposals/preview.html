<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Logo proposals</title>
    <style>
      body { margin: 0; background: #f4f0e8; color: #1c1915; font-family: Georgia, serif; }
      main { display: flex; gap: 48px; padding: 48px; }
      figure { margin: 0; text-align: center; }
      img.large { width: 160px; height: 160px; display: block; }
      img.small { width: 28px; height: 28px; display: block; margin: 18px auto 0; }
      figcaption { margin-top: 14px; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <img class="large" src="01-rising-sun.svg" alt="Rising sun" />
        <img class="small" src="01-rising-sun.svg" alt="" />
        <figcaption>1 · Rising sun</figcaption>
      </figure>
      <figure>
        <img class="large" src="02-day-sun.svg" alt="Day sun" />
        <img class="small" src="02-day-sun.svg" alt="" />
        <figcaption>2 · Day sun</figcaption>
      </figure>
      <figure>
        <img class="large" src="03-sun-and-sea.svg" alt="Sun and sea" />
        <img class="small" src="03-sun-and-sea.svg" alt="" />
        <figcaption>3 · Sun and sea</figcaption>
      </figure>
    </main>
  </body>
</html>
